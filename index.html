
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EDEBE6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Продажи">
    <link rel="manifest" href="manifest.json">
    <title>Продажи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #root {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #EDEBE6;
            color: #17150F;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        input[type="date"], select {
            border: 0;
            border-bottom: 1px solid rgba(23,21,15,0.18);
            background: transparent;
            font-size: 15px;
            color: #17150F;
            padding: 0 0 8px;
            outline: none;
            font-family: inherit;
        }
        input[type="date"]:focus, select:focus {
            border-bottom-color: #17150F;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const SalesDashboard = () => {
          const [shops, setShops] = useState({
            shop1: { name: 'Блеск', token: '', name_long: 'Блеск' },
            shop2: { name: 'Мир рукоделия', token: '', name_long: 'Мир рукоделия' }
          });

          const [activeShop, setActiveShop] = useState('shop1');
          const [screen, setScreen] = useState('today');
          const [period, setPeriod] = useState('day');
          
          const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
          const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);
          
          const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
          const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
          const [compareMode, setCompareMode] = useState(false);

          const [salesData, setSalesData] = useState({
            shop1: {
              summary: { total: 0, count: 0, cash: 0, cashless: 0, firstTime: null, lastTime: null, loading: false, avgCheck: 0, maxCheck: 0 },
              receipts: [],
              products: [],
              categories: [],
              hourly: [],
              daily: [],
              monthly: [],
              yearly: []
            },
            shop2: {
              summary: { total: 0, count: 0, cash: 0, cashless: 0, firstTime: null, lastTime: null, loading: false, avgCheck: 0, maxCheck: 0 },
              receipts: [],
              products: [],
              categories: [],
              hourly: [],
              daily: [],
              monthly: [],
              yearly: []
            }
          });

          const [settingsOpen, setSettingsOpen] = useState(false);
          const [tempTokens, setTempTokens] = useState({ shop1: '', shop2: '' });
          const [error, setError] = useState(null);

          const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

          const topCategories = ['Косметика', 'Аксессуары', 'Средства', 'Инструменты', 'Украшения'];
          const topProducts = ['Матовая помада', 'Крем для лица', 'Тушь для ресниц', 'Блеск для губ', 'Консилер'];

          const generateMockProducts = () => {
            const products = [];
            for (let i = 0; i < 8; i++) {
              products.push({
                id: i + 1,
                name: topProducts[i % topProducts.length],
                category: topCategories[i % topCategories.length],
                quantity: Math.floor(Math.random() * 50) + 5,
                revenue: Math.floor(Math.random() * 15000) + 2000,
                percent: Math.floor(Math.random() * 20) + 5
              });
            }
            return products.sort((a, b) => b.revenue - a.revenue);
          };

          const generateMockCategories = () => {
            const cats = [];
            for (let i = 0; i < 5; i++) {
              cats.push({
                name: topCategories[i],
                quantity: Math.floor(Math.random() * 150) + 30,
                revenue: Math.floor(Math.random() * 50000) + 10000,
                percent: Math.floor(Math.random() * 30) + 10
              });
            }
            return cats.sort((a, b) => b.revenue - a.revenue);
          };

          const generateHourlyData = () => {
            const data = [];
            for (let i = 9; i <= 21; i++) {
              const value = Math.floor(Math.random() * 8000) + 1000;
              data.push({ hour: i, value });
            }
            return data;
          };

          const generateDailyData = () => {
            const data = [];
            const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            for (let i = 0; i < 7; i++) {
              const value = Math.floor(Math.random() * 50000) + 20000;
              data.push({ day: days[i], value });
            }
            return data;
          };

          const generateMonthlyData = () => {
            const data = [];
            for (let i = 0; i < 12; i++) {
              const value = Math.floor(Math.random() * 200000) + 80000;
              data.push({ month: monthNames[i].substring(0, 3), value });
            }
            return data;
          };

          const generateYearlyData = () => {
            const data = [];
            const year = new Date().getFullYear();
            for (let i = 0; i < 5; i++) {
              const value = Math.floor(Math.random() * 2000000) + 1000000;
              data.push({ year: year - (4 - i), value });
            }
            return data;
          };

          const generateMockReceipts = (count, baseTime) => {
            const receipts = [];
            for (let i = 0; i < count; i++) {
              const amount = Math.floor(Math.random() * 2000) + 200;
              const time = new Date(baseTime.getTime() - i * 15 * 60 * 1000);
              receipts.push({
                id: Math.random().toString(36).substr(2, 9),
                fn: 7600 + i,
                rn: `000694${String(i).padStart(10, '0')}`,
                sum: amount,
                cash: Math.random() > 0.3 ? 0 : amount,
                cashless: Math.random() > 0.3 ? amount : 0,
                date: time,
                place: shops[activeShop].name_long,
                items: Math.floor(Math.random() * 8) + 1
              });
            }
            return receipts;
          };

          const fetchSalesData = useCallback(async (shopKey) => {
            const token = shops[shopKey]?.token;
            if (!token) {
              setError('API токен не установлен');
              return;
            }

            setSalesData(prev => ({
              ...prev,
              [shopKey]: {
                ...prev[shopKey],
                summary: { ...prev[shopKey].summary, loading: true }
              }
            }));

            try {
              const today = new Date();
              const mockReceiptCount = period === 'day' ? 12 : period === 'week' ? 47 : 150;
              const receipts = generateMockReceipts(mockReceiptCount, today);
              const products = generateMockProducts();
              const categories = generateMockCategories();
              const hourly = generateHourlyData();
              const daily = generateDailyData();
              const monthly = generateMonthlyData();
              const yearly = generateYearlyData();
              
              const totalSum = receipts.reduce((sum, r) => sum + r.sum, 0);
              const cashSum = receipts.reduce((sum, r) => sum + r.cash, 0);
              const cashlessSum = receipts.reduce((sum, r) => sum + r.cashless, 0);
              const avgCheck = receipts.length > 0 ? totalSum / receipts.length : 0;
              const maxCheck = receipts.length > 0 ? Math.max(...receipts.map(r => r.sum)) : 0;

              setSalesData(prev => ({
                ...prev,
                [shopKey]: {
                  summary: {
                    total: totalSum,
                    count: receipts.length,
                    cash: cashSum,
                    cashless: cashlessSum,
                    firstTime: receipts[receipts.length - 1]?.date || null,
                    lastTime: receipts[0]?.date || null,
                    avgCheck: avgCheck,
                    maxCheck: maxCheck,
                    loading: false
                  },
                  receipts: receipts.sort((a, b) => b.date - a.date),
                  products: products,
                  categories: categories,
                  hourly: hourly,
                  daily: daily,
                  monthly: monthly,
                  yearly: yearly
                }
              }));
              setError(null);
            } catch (err) {
              console.error(`Error: ${err.message}`);
              setError(`Ошибка: ${err.message}`);
              setSalesData(prev => ({
                ...prev,
                [shopKey]: {
                  ...prev[shopKey],
                  summary: { ...prev[shopKey].summary, loading: false }
                }
              }));
            }
          }, [shops, period, activeShop]);

          useEffect(() => {
            const savedTokens = localStorage.getItem('ofdTokens');
            if (savedTokens) {
              const parsed = JSON.parse(savedTokens);
              setShops(prev => ({
                shop1: { ...prev.shop1, token: parsed.shop1 || '' },
                shop2: { ...prev.shop2, token: parsed.shop2 || '' }
              }));
              setTempTokens(parsed);
            }
          }, []);

          useEffect(() => {
            if (shops[activeShop]?.token) {
              fetchSalesData(activeShop);
            }
          }, [activeShop, period, screen, shops, fetchSalesData]);

          const handleSaveTokens = () => {
            localStorage.setItem('ofdTokens', JSON.stringify(tempTokens));
            setShops(prev => ({
              shop1: { ...prev.shop1, token: tempTokens.shop1 },
              shop2: { ...prev.shop2, token: tempTokens.shop2 }
            }));
            setSettingsOpen(false);
            setError(null);
            if (tempTokens[activeShop]) fetchSalesData(activeShop);
          };

          const handleTokenChange = (shop, value) => {
            setTempTokens(prev => ({
              ...prev,
              [shop]: value
            }));
          };

          const currentData = salesData[activeShop];
          const currentShop = shops[activeShop];

          const formatCurrency = (value) => {
            return new Intl.NumberFormat('ru-RU', {
              style: 'currency',
              currency: 'RUB',
              minimumFractionDigits: 0,
              maximumFractionDigits: 0
            }).format(value);
          };

          const formatTime = (date) => {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
          };

          const getYearOptions = () => {
            const years = [];
            for (let i = new Date().getFullYear(); i >= 2020; i--) {
              years.push(i);
            }
            return years;
          };

          // Компонент графика
          const Chart = ({ data, type = 'bars' }) => {
            if (!data || data.length === 0) return null;
            
            const maxValue = Math.max(...data.map(d => d.value));
            const minValue = Math.min(...data.map(d => d.value));
            const range = maxValue - minValue || maxValue;
            
            return (
              <div style={{display: 'flex', alignItems: 'flex-end', gap: '3px', height: '64px', margin: '36px 0 10px', justifyContent: 'space-between'}}>
                {data.map((item, idx) => {
                  const percentage = range > 0 ? ((item.value - minValue) / range * 100) : 50;
                  const barHeight = Math.max(percentage, 8);
                  return (
                    <div
                      key={idx}
                      style={{
                        flex: 1,
                        height: `${barHeight}%`,
                        background: '#17150F',
                        borderRadius: '2px',
                        opacity: 0.7
                      }}
                    />
                  );
                })}
              </div>
            );
          };

          // Labels для графика
          const ChartLabels = ({ data, type = 'hours' }) => {
            if (!data || data.length === 0) return null;
            
            let firstLabel, lastLabel;
            if (type === 'hours') {
              firstLabel = data[0].hour + ':00';
              lastLabel = data[data.length - 1].hour + ':00';
            } else if (type === 'days') {
              firstLabel = data[0].day;
              lastLabel = data[data.length - 1].day;
            } else if (type === 'months') {
              firstLabel = data[0].month;
              lastLabel = data[data.length - 1].month;
            } else if (type === 'years') {
              firstLabel = data[0].year;
              lastLabel = data[data.length - 1].year;
            }
            
            return (
              <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#A9A69C', fontVariantNumeric: 'tabular-nums'}}>
                <div>{firstLabel}</div>
                <div>{lastLabel}</div>
              </div>
            );
          };

          const styles = {
            container: {
              minHeight: '100vh',
              background: '#EDEBE6',
              display: 'flex',
              flexDirection: 'column',
              color: '#17150F'
            },
            content: {
              flex: 1,
              overflowY: 'auto',
              paddingBottom: 80
            },
            header: {
              padding: '66px 24px 0',
              display: 'flex',
              alignItems: 'baseline',
              justifyContent: 'space-between',
              backgroundColor: '#F7F6F3'
            },
            headerTitle: {
              fontSize: '15px',
              letterSpacing: '0.14em',
              textTransform: 'uppercase',
              color: '#8B887E'
            },
            settingsBtn: {
              fontSize: '13px',
              letterSpacing: '0.06em',
              color: '#8B887E',
              cursor: 'pointer',
              padding: '4px 0',
              background: 'none',
              border: 'none',
              fontFamily: 'inherit'
            },
            shopTabs: {
              display: 'flex',
              gap: '24px',
              padding: '22px 24px 0',
              background: '#F7F6F3',
              borderBottom: '1px solid rgba(23,21,15,0.09)',
              overflowX: 'auto'
            },
            shopTab: {
              fontSize: '15px',
              cursor: 'pointer',
              background: 'none',
              border: 'none',
              fontFamily: 'inherit',
              color: '#8B887E',
              padding: '0 0 22px 0',
              borderBottom: '2px solid transparent',
              transition: 'all 0.3s'
            },
            shopTabActive: {
              color: '#17150F',
              borderBottomColor: '#17150F'
            },
            mainCard: {
              background: '#F7F6F3',
              borderRadius: 0,
              padding: '0 24px 24px',
              margin: '0',
              boxShadow: 'none',
              borderTop: '1px solid rgba(23,21,15,0.09)'
            },
            mainValue: {
              fontSize: '52px',
              fontWeight: '400',
              color: '#17150F',
              marginBottom: '0',
              letterSpacing: '-0.03em',
              fontVariantNumeric: 'tabular-nums',
              lineHeight: '1'
            },
            mainLabel: {
              fontSize: '13px',
              color: '#8B887E',
              marginBottom: '36px',
              letterSpacing: '0.02em'
            },
            statRow: {
              display: 'flex',
              justifyContent: 'space-between',
              paddingBottom: '16px',
              borderBottom: '1px solid rgba(23,21,15,0.09)',
              fontSize: '15px',
              color: '#17150F',
              paddingTop: '16px'
            },
            statRowFirst: {
              borderTop: '1px solid rgba(23,21,15,0.09)',
              paddingTop: '16px'
            },
            statLabel: {
              color: '#8B887E'
            },
            statValue: {
              fontWeight: '500',
              color: '#17150F',
              fontVariantNumeric: 'tabular-nums'
            },
            productRow: {
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              paddingBottom: '16px',
              borderBottom: '1px solid rgba(23,21,15,0.09)',
              fontSize: '15px',
              paddingTop: '16px'
            },
            productName: {
              display: 'flex',
              flexDirection: 'column',
              gap: '4px'
            },
            productCategory: {
              fontSize: '12px',
              color: '#A9A69C'
            },
            productRight: {
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'flex-end',
              gap: '2px'
            },
            productQty: {
              fontSize: '12px',
              color: '#A9A69C',
              fontVariantNumeric: 'tabular-nums'
            },
            bottomNav: {
              position: 'fixed',
              bottom: 0,
              left: 0,
              right: 0,
              height: 80,
              background: '#F7F6F3',
              borderTop: '1px solid rgba(23,21,15,0.09)',
              display: 'flex',
              justifyContent: 'space-around',
              alignItems: 'flex-start',
              paddingTop: 8,
              paddingBottom: 26,
              zIndex: 100
            },
            navButton: {
              background: 'none',
              border: 'none',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              cursor: 'pointer',
              fontSize: '11px',
              color: '#A9A69C',
              fontWeight: '500',
              padding: '0',
              fontFamily: 'inherit'
            },
            navDot: {
              width: '6px',
              height: '6px',
              borderRadius: '50%',
              background: '#A9A69C',
              marginBottom: '8px'
            },
            navButtonActive: {
              color: '#17150F'
            },
            navDotActive: {
              background: '#17150F'
            },
            modal: {
              position: 'fixed',
              top: 0,
              left: 0,
              right: 0,
              bottom: 0,
              background: 'rgba(7, 6, 4, 0.3)',
              display: 'flex',
              alignItems: 'flex-end',
              zIndex: 1000
            },
            modalContent: {
              background: '#F7F6F3',
              borderRadius: 0,
              padding: '32px 24px 20px',
              width: '100%',
              maxHeight: '90vh',
              overflowY: 'auto',
              borderTop: '1px solid rgba(23,21,15,0.09)'
            },
            input: {
              width: '100%',
              padding: '0 0 8px',
              borderRadius: 0,
              border: 0,
              borderBottom: '1px solid rgba(23,21,15,0.18)',
              fontSize: '15px',
              marginBottom: '16px',
              fontFamily: 'monospace',
              background: 'transparent',
              color: '#17150F',
              outline: 'none'
            },
            btn: {
              padding: '12px 20px',
              borderRadius: 0,
              border: '1px solid #17150F',
              fontSize: '13px',
              fontWeight: '500',
              cursor: 'pointer',
              transition: 'all 0.3s',
              background: '#F7F6F3',
              color: '#17150F',
              fontFamily: 'inherit'
            },
            btnPrimary: {
              background: '#17150F',
              color: '#F7F6F3',
              border: '1px solid #17150F',
              width: '100%'
            },
            errorBanner: {
              background: '#F7F6F3',
              color: '#17150F',
              padding: '16px 24px',
              borderRadius: 0,
              margin: '0',
              fontSize: '13px',
              borderBottom: '1px solid rgba(23,21,15,0.09)'
            }
          };

          // ЭКРАН 1: СЕГОДНЯ
          const TodayScreen = () => (
            <>
              <div style={styles.shopTabs}>
                {Object.entries(shops).map(([key, shop]) => (
                  <button
                    key={key}
                    style={{
                      ...styles.shopTab,
                      ...(activeShop === key ? styles.shopTabActive : {})
                    }}
                    onClick={() => setActiveShop(key)}
                  >
                    {shop.name}
                  </button>
                ))}
              </div>

              <div style={styles.content}>
                {error && <div style={styles.errorBanner}>{error}</div>}

                {!currentShop.token ? (
                  <div style={{...styles.mainCard, paddingTop: '40px', textAlign: 'center'}}>
                    <p style={{fontSize: 14, color: '#8B887E'}}>Добавьте токен в настройках</p>
                  </div>
                ) : (
                  <>
                    <div style={styles.mainCard}>
                      <div style={{paddingTop: '40px', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                        <div style={styles.mainValue}>{formatCurrency(currentData.summary.total)}</div>
                        <div style={styles.mainLabel}>Выручка сегодня · {new Date().toLocaleDateString('ru-RU')}</div>
                      </div>

                      <Chart data={currentData.hourly} />
                      <ChartLabels data={currentData.hourly} type="hours" />

                      <div style={{marginTop: '36px', display: 'flex', flexDirection: 'column'}}>
                        <div style={{...styles.statRow, ...styles.statRowFirst}}>
                          <span style={styles.statLabel}>Чеков</span>
                          <span style={styles.statValue}>{currentData.summary.count}</span>
                        </div>

                        <div style={styles.statRow}>
                          <span style={styles.statLabel}>Средний чек</span>
                          <span style={styles.statValue}>{formatCurrency(currentData.summary.avgCheck)}</span>
                        </div>

                        <div style={styles.statRow}>
                          <span style={styles.statLabel}>Максимальный чек</span>
                          <span style={styles.statValue}>{formatCurrency(currentData.summary.maxCheck)}</span>
                        </div>

                        <div style={{...styles.statRow, borderBottom: 'none'}}>
                          <span style={styles.statLabel}>Последняя продажа</span>
                          <span style={styles.statValue}>
                            {currentData.summary.lastTime ? formatTime(currentData.summary.lastTime) : '—'}
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* Топ товаров */}
                    <div style={styles.mainCard}>
                      <div style={{paddingTop: '36px', display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '24px'}}>
                        <div style={{fontSize: '15px', fontWeight: '500'}}>Топ товаров</div>
                      </div>

                      <div>
                        {currentData.products.slice(0, 5).map((product, idx) => (
                          <div key={idx} style={styles.productRow}>
                            <div style={styles.productName}>
                              <div>{product.name}</div>
                              <div style={styles.productCategory}>{product.category}</div>
                            </div>
                            <div style={styles.productRight}>
                              <div style={{fontVariantNumeric: 'tabular-nums'}}>{formatCurrency(product.revenue)}</div>
                              <div style={styles.productQty}>{product.quantity} шт</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Категории */}
                    <div style={styles.mainCard}>
                      <div style={{paddingTop: '36px', display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '24px'}}>
                        <div style={{fontSize: '15px', fontWeight: '500'}}>По категориям</div>
                      </div>

                      <div>
                        {currentData.categories.map((cat, idx) => (
                          <div key={idx} style={styles.productRow}>
                            <div style={styles.productName}>
                              <div>{cat.name}</div>
                              <div style={styles.productCategory}>{cat.quantity} шт</div>
                            </div>
                            <div style={styles.productRight}>
                              <div style={{fontVariantNumeric: 'tabular-nums'}}>{formatCurrency(cat.revenue)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </div>
            </>
          );

          // ЭКРАН 2: НЕДЕЛЯ
          const WeekScreen = () => (
            <>
              <div style={styles.shopTabs}>
                {Object.entries(shops).map(([key, shop]) => (
                  <button
                    key={key}
                    style={{
                      ...styles.shopTab,
                      ...(activeShop === key ? styles.shopTabActive : {})
                    }}
                    onClick={() => setActiveShop(key)}
                  >
                    {shop.name}
                  </button>
                ))}
              </div>

              <div style={styles.content}>
                {error && <div style={styles.errorBanner}>{error}</div>}

                {!currentShop.token ? (
                  <div style={{...styles.mainCard, textAlign: 'center'}}>
                    <p style={{fontSize: 14, color: '#8B887E'}}>Добавьте токен в настройках</p>
                  </div>
                ) : (
                  <div style={styles.mainCard}>
                    <div style={{paddingTop: '40px', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                      <div style={{...styles.mainValue, fontSize: '44px'}}>{formatCurrency(currentData.daily.reduce((sum, d) => sum + d.value, 0))}</div>
                      <div style={styles.mainLabel}>Выручка за неделю</div>
                    </div>

                    <Chart data={currentData.daily} />
                    <ChartLabels data={currentData.daily} type="days" />

                    <div style={{marginTop: '34px', display: 'flex', flexDirection: 'column'}}>
                      <div style={{...styles.statRow, ...styles.statRowFirst}}>
                        <span style={styles.statLabel}>Среднее за день</span>
                        <span style={styles.statValue}>{formatCurrency(currentData.daily.reduce((sum, d) => sum + d.value, 0) / 7)}</span>
                      </div>

                      <div style={{...styles.statRow, borderBottom: 'none'}}>
                        <span style={styles.statLabel}>Лучший день</span>
                        <span style={styles.statValue}>{formatCurrency(Math.max(...currentData.daily.map(d => d.value)))}</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </>
          );

          // ЭКРАН 3: МЕСЯЦЫ
          const MonthsScreen = () => (
            <>
              <div style={styles.shopTabs}>
                {Object.entries(shops).map(([key, shop]) => (
                  <button
                    key={key}
                    style={{
                      ...styles.shopTab,
                      ...(activeShop === key ? styles.shopTabActive : {})
                    }}
                    onClick={() => setActiveShop(key)}
                  >
                    {shop.name}
                  </button>
                ))}
              </div>

              <div style={styles.content}>
                <div style={{...styles.mainCard, paddingTop: '30px'}}>
                  <div style={{display: 'flex', gap: '8px', overflowX: 'auto', marginBottom: '20px'}}>
                    {monthNames.map((m, i) => (
                      <button
                        key={i}
                        onClick={() => setSelectedMonth(i)}
                        style={{
                          background: selectedMonth === i ? '#17150F' : 'transparent',
                          color: selectedMonth === i ? '#F7F6F3' : '#8B887E',
                          border: 'none',
                          cursor: 'pointer',
                          padding: '6px 12px',
                          fontSize: '13px',
                          fontFamily: 'inherit',
                          whiteSpace: 'nowrap',
                          borderRadius: '2px'
                        }}
                      >
                        {m.substring(0, 3)}
                      </button>
                    ))}
                  </div>

                  <div style={{display: 'flex', gap: '20px'}}>
                    {getYearOptions().slice(0, 3).map(y => (
                      <button
                        key={y}
                        onClick={() => setSelectedYear(y)}
                        style={{
                          background: selectedYear === y ? '#17150F' : 'transparent',
                          color: selectedYear === y ? '#F7F6F3' : '#8B887E',
                          border: 'none',
                          cursor: 'pointer',
                          padding: '6px 12px',
                          fontSize: '13px',
                          fontFamily: 'inherit',
                          whiteSpace: 'nowrap',
                          borderRadius: '2px'
                        }}
                      >
                        {y}
                      </button>
                    ))}
                  </div>
                </div>

                {error && <div style={styles.errorBanner}>{error}</div>}

                {!currentShop.token ? (
                  <div style={{...styles.mainCard, textAlign: 'center'}}>
                    <p style={{fontSize: 14, color: '#8B887E'}}>Добавьте токен в настройках</p>
                  </div>
                ) : (
                  <>
                    <div style={styles.mainCard}>
                      <div style={{paddingTop: '36px', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                        <div style={{...styles.mainValue, fontSize: '44px'}}>{formatCurrency(currentData.summary.total)}</div>
                        <div style={styles.mainLabel}>{monthNames[selectedMonth]} {selectedYear}</div>
                      </div>

                      <Chart data={currentData.monthly} />
                      <ChartLabels data={currentData.monthly} type="months" />

                      <div style={{marginTop: '34px', display: 'flex', flexDirection: 'column'}}>
                        <div style={{...styles.statRow, ...styles.statRowFirst}}>
                          <span style={styles.statLabel}>Чеков</span>
                          <span style={styles.statValue}>{currentData.summary.count}</span>
                        </div>

                        <div style={{...styles.statRow, borderBottom: 'none'}}>
                          <span style={styles.statLabel}>Средний чек</span>
                          <span style={styles.statValue}>{formatCurrency(currentData.summary.avgCheck)}</span>
                        </div>
                      </div>

                      <button
                        onClick={() => setCompareMode(!compareMode)}
                        style={{
                          marginTop: '22px',
                          fontSize: '13px',
                          letterSpacing: '0.04em',
                          color: '#8B887E',
                          cursor: 'pointer',
                          background: 'none',
                          border: 'none',
                          fontFamily: 'inherit',
                          padding: '0'
                        }}
                      >
                        {compareMode ? '−  Скрыть сравнение' : '+  Сравнить год к году'}
                      </button>

                      {compareMode && (
                        <div style={{marginTop: '20px', paddingTop: '20px', borderTop: '1px solid rgba(23,21,15,0.09)', borderBottom: '1px solid rgba(23,21,15,0.09)', display: 'flex', flexDirection: 'column', gap: '14px'}}>
                          <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '15px'}}>
                            <span style={{color: '#8B887E'}}>{monthNames[selectedMonth]} {selectedYear - 1}</span>
                            <span style={{fontVariantNumeric: 'tabular-nums'}}>{formatCurrency(currentData.summary.total * 0.85)}</span>
                          </div>
                          <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '15px'}}>
                            <span style={{color: '#8B887E'}}>Динамика</span>
                            <span style={{color: '#17150F', fontWeight: '500'}}>+15%</span>
                          </div>
                        </div>
                      )}
                    </div>
                  </>
                )}
              </div>
            </>
          );

          // ЭКРАН 4: ГОДЫ
          const YearsScreen = () => (
            <>
              <div style={styles.shopTabs}>
                {Object.entries(shops).map(([key, shop]) => (
                  <button
                    key={key}
                    style={{
                      ...styles.shopTab,
                      ...(activeShop === key ? styles.shopTabActive : {})
                    }}
                    onClick={() => setActiveShop(key)}
                  >
                    {shop.name}
                  </button>
                ))}
              </div>

              <div style={styles.content}>
                {error && <div style={styles.errorBanner}>{error}</div>}

                {!currentShop.token ? (
                  <div style={{...styles.mainCard, textAlign: 'center'}}>
                    <p style={{fontSize: 14, color: '#8B887E'}}>Добавьте токен в настройках</p>
                  </div>
                ) : (
                  <div style={styles.mainCard}>
                    <div style={{paddingTop: '40px', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                      <div style={{...styles.mainValue, fontSize: '44px'}}>{formatCurrency(currentData.yearly.reduce((sum, y) => sum + y.value, 0))}</div>
                      <div style={styles.mainLabel}>Выручка за 5 лет</div>
                    </div>

                    <Chart data={currentData.yearly} />
                    <ChartLabels data={currentData.yearly} type="years" />

                    <div style={{marginTop: '34px', display: 'flex', flexDirection: 'column'}}>
                      <div style={{...styles.statRow, ...styles.statRowFirst}}>
                        <span style={styles.statLabel}>Среднее за год</span>
                        <span style={styles.statValue}>{formatCurrency(currentData.yearly.reduce((sum, y) => sum + y.value, 0) / 5)}</span>
                      </div>

                      <div style={{...styles.statRow, borderBottom: 'none'}}>
                        <span style={styles.statLabel}>Лучший год</span>
                        <span style={styles.statValue}>{formatCurrency(Math.max(...currentData.yearly.map(y => y.value)))}</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </>
          );

          // ЭКРАН 5: СРАВНЕНИЕ
          const ComparisonScreen = () => {
            const data1 = salesData.shop1.summary;
            const data2 = salesData.shop2.summary;

            return (
              <>
                <div style={styles.shopTabs}>
                  <button
                    style={{
                      ...styles.shopTab,
                      color: '#17150F',
                      borderBottomColor: '#17150F'
                    }}
                  >
                    Оба магазина
                  </button>
                </div>

                <div style={styles.content}>
                  {error && <div style={styles.errorBanner}>{error}</div>}

                  {!shops.shop1.token || !shops.shop2.token ? (
                    <div style={{...styles.mainCard, textAlign: 'center'}}>
                      <p style={{fontSize: 14, color: '#8B887E'}}>Добавьте токены для обоих магазинов</p>
                    </div>
                  ) : (
                    <>
                      <div style={styles.mainCard}>
                        <div style={{paddingTop: '40px', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                          <div style={{...styles.mainValue, fontSize: '44px'}}>{formatCurrency(data1.total + data2.total)}</div>
                          <div style={styles.mainLabel}>Оба магазина · сегодня</div>
                        </div>

                        <div style={{marginTop: '40px', display: 'flex', flexDirection: 'column', gap: '28px'}}>
                          {[
                            { name: shops.shop1.name, rev: data1.total, checks: data1.count, share: Math.round((data1.total / (data1.total + data2.total)) * 100) },
                            { name: shops.shop2.name, rev: data2.total, checks: data2.count, share: Math.round((data2.total / (data1.total + data2.total)) * 100) }
                          ].map((store, idx) => (
                            <div key={idx} style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline'}}>
                                <div style={{fontSize: '15px'}}>{store.name}</div>
                                <div style={{fontSize: '15px', fontVariantNumeric: 'tabular-nums'}}>{formatCurrency(store.rev)}</div>
                              </div>
                              <div style={{height: '2px', background: 'rgba(23,21,15,0.1)'}}>
                                <div style={{height: '2px', background: '#17150F', width: `${store.share}%`}}></div>
                              </div>
                              <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#A9A69C', fontVariantNumeric: 'tabular-nums'}}>
                                <div>{store.checks} чеков</div>
                                <div>{store.share}% от общей</div>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div style={{marginTop: '36px', paddingTop: '16px', borderTop: '1px solid rgba(23,21,15,0.09)', display: 'flex', justifyContent: 'space-between', fontSize: '15px'}}>
                          <span style={{color: '#8B887E'}}>Разница</span>
                          <span style={{fontVariantNumeric: 'tabular-nums'}}>{formatCurrency(Math.abs(data1.total - data2.total))}</span>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </>
            );
          };

          return (
            <div style={styles.container}>
              {/* Шапка */}
              <div style={styles.header}>
                <div style={styles.headerTitle}>Продажи</div>
                <button
                  onClick={() => setSettingsOpen(true)}
                  style={styles.settingsBtn}
                >
                  НАСТРОЙКИ
                </button>
              </div>

              {/* Модал настроек */}
              {settingsOpen && (
                <div style={styles.modal}>
                  <div style={styles.modalContent}>
                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '24px'}}>
                      <h2 style={{fontSize: '16px', fontWeight: '500', margin: 0}}>Настройки</h2>
                      <button
                        onClick={() => setSettingsOpen(false)}
                        style={{background: 'none', border: 'none', fontSize: '18px', cursor: 'pointer', color: '#17150F'}}
                      >
                        ×
                      </button>
                    </div>

                    <div style={{marginBottom: '20px'}}>
                      <label style={{fontSize: '11px', color: '#8B887E', display: 'block', marginBottom: '8px', letterSpacing: '0.1em', textTransform: 'uppercase'}}>
                        {shops.shop1.name}
                      </label>
                      <input
                        type="password"
                        placeholder="API токен"
                        value={tempTokens.shop1}
                        onChange={(e) => handleTokenChange('shop1', e.target.value)}
                        style={styles.input}
                      />
                    </div>

                    <div style={{marginBottom: '24px'}}>
                      <label style={{fontSize: '11px', color: '#8B887E', display: 'block', marginBottom: '8px', letterSpacing: '0.1em', textTransform: 'uppercase'}}>
                        {shops.shop2.name}
                      </label>
                      <input
                        type="password"
                        placeholder="API токен"
                        value={tempTokens.shop2}
                        onChange={(e) => handleTokenChange('shop2', e.target.value)}
                        style={styles.input}
                      />
                    </div>

                    <p style={{fontSize: '12px', color: '#8B887E', marginBottom: '24px', lineHeight: '1.6'}}>
                      Яндекс.ОФД → Интеграции → API
                    </p>

                    <button
                      onClick={handleSaveTokens}
                      style={{...styles.btn, ...styles.btnPrimary, marginBottom: '8px'}}
                    >
                      Сохранить
                    </button>
                    <button
                      onClick={() => setSettingsOpen(false)}
                      style={{...styles.btn, width: '100%'}}
                    >
                      Отмена
                    </button>
                  </div>
                </div>
              )}

              {/* Основной контент */}
              {screen === 'today' && <TodayScreen />}
              {screen === 'week' && <WeekScreen />}
              {screen === 'months' && <MonthsScreen />}
              {screen === 'years' && <YearsScreen />}
              {screen === 'comparison' && <ComparisonScreen />}

              {/* Нижняя навигация */}
              <div style={styles.bottomNav}>
                {[
                  { id: 'today', label: 'Сегодня' },
                  { id: 'week', label: 'Неделя' },
                  { id: 'months', label: 'Месяцы' },
                  { id: 'years', label: 'Годы' },
                  { id: 'comparison', label: 'Сравнение' }
                ].map(item => (
                  <button
                    key={item.id}
                    style={{
                      ...styles.navButton,
                      ...(screen === item.id ? styles.navButtonActive : {})
                    }}
                    onClick={() => setScreen(item.id)}
                  >
                    <div style={{
                      ...styles.navDot,
                      ...(screen === item.id ? styles.navDotActive : {})
                    }}></div>
                    <div>{item.label}</div>
                  </button>
                ))}
              </div>
            </div>
          );
        };

        ReactDOM.render(<SalesDashboard />, document.getElementById('root'));
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('ServiceWorker registration failed: ', err);
            });
        }
    </script>
</body>
</html>
