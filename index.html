<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EDEBE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Продажи">
<link rel="manifest" href="manifest.json">
<title>Продажи</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background:#EDEBE6; color:#17150F; -webkit-font-smoothing:antialiased;
  }
  #root { display:flex; flex-direction:column; overflow:hidden; }
  input, select, button { font-family:inherit; }
  input[type="date"] {
    border:1px solid rgba(23,21,15,0.22); background:#FFFDFA; color:#17150F;
    font-size:16px; padding:10px 12px; border-radius:4px; width:100%; outline:none;
  }
  ::-webkit-scrollbar { display:none; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 0.8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   1. ОБЩЕЕ
   ============================================================ */

const SHOPS = { shop1: { name: 'Блеск' }, shop2: { name: 'Мир рукоделия' } };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const DOW_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const money = v => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(Math.round(v || 0));
const hhmm = d => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const dmy = d => d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
const longDate = d => d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long' });
const plural = (n, a, b, c) => { const m = n % 100; if (m >= 11 && m <= 14) return c; const k = n % 10; return k === 1 ? a : (k >= 2 && k <= 4 ? b : c); };
const parseOfdDate = s => s ? new Date(String(s).replace(' ', 'T')) : null;
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);

/* ============================================================
   2. API ЯНДЕКС ОФД
   ============================================================ */

async function ofd(token, path, params = {}) {
  const qs = new URLSearchParams({ path, ...params }).toString();
  const r = await fetch(`/api/ofd?${qs}`, { headers: { 'X-Yandex-Ofd-Token': token } });
  const text = await r.text();
  let json = null;
  try { json = JSON.parse(text); } catch (e) {}
  if (!r.ok) {
    const msg = (json && (json.error || json.message)) || `HTTP ${r.status}`;
    if (r.status === 401 || r.status === 403) throw new Error('Токен не принят ОФД. Проверьте его в настройках.');
    if (r.status === 404) throw new Error('Прокси /api/ofd не найден. Загрузите файл api/ofd.js в репозиторий.');
    throw new Error(msg);
  }
  return json;
}

async function ofdRows(token, path, params) {
  const LIMIT = 1000;
  let offset = 0, all = [];
  for (let page = 0; page < 15; page++) {
    const json = await ofd(token, path, { ...params, limit: LIMIT, offset });
    const rows = (json && json.data && json.data.rows) || [];
    all = all.concat(rows);
    if (rows.length < LIMIT) break;
    offset += LIMIT;
  }
  return all;
}

const cashboxCache = new Map();
async function apiCashboxIds(token) {
  if (cashboxCache.has(token)) return cashboxCache.get(token);
  const list = await ofd(token, 'cashboxes');
  const ids = (Array.isArray(list) ? list : []).map(c => c.id).filter(v => v !== undefined && v !== null);
  if (!ids.length) throw new Error('В этом аккаунте ОФД не найдено ни одной кассы.');
  cashboxCache.set(token, ids);
  return ids;
}

async function ofdRowsAllCashboxes(token, path, params) {
  const ids = await apiCashboxIds(token);
  let all = [];
  for (const id of ids) all = all.concat(await ofdRows(token, path, { ...params, cashboxIds: id }));
  return all;
}

const addDaysStr = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };

async function apiReceipts(token, from, to) {
  const rows = await ofdRowsAllCashboxes(token, 'reports/receipts', { from, to: addDaysStr(to, 1) });
  const children = new Map();
  rows.forEach(r => {
    if (r.Parent) {
      const arr = children.get(r.Parent) || [];
      arr.push({ name: r.itemNameFlat || 'Без названия', qty: Number(r.itemQuantityFlat) || 0, total: Number(r.itemSumFlat) || 0 });
      children.set(r.Parent, arr);
    }
  });
  const lo = new Date(from + 'T00:00:00'), hi = new Date(to + 'T23:59:59.999');
  return rows
    .filter(r => !r.Parent && r.operationType === 'Приход')
    .map(r => ({
      id: r.Id, date: parseOfdDate(r.dateTime), sum: Number(r.totalSum) || 0,
      cash: Number(r.cashTotalSum) || 0, ecash: Number(r.ecashTotalSum) || 0,
      items: children.get(r.Id) || []
    }))
    .filter(r => r.date && r.date >= lo && r.date <= hi)
    .sort((a, b) => a.date - b.date);
}

async function apiDays(token, from, to) {
  const rows = await ofdRowsAllCashboxes(token, 'reports/shifts', { from, to: addDaysStr(to, 1) });
  const byDay = {};
  rows.forEach(s => {
    const raw = s.closeShiftDateTime || s.openShiftDateTime;
    if (!raw) return;
    const key = String(raw).slice(0, 10);
    if (key < from || key > to) return;
    if (!byDay[key]) byDay[key] = { sum: 0, cnt: 0 };
    byDay[key].sum += (Number(s.incomeSum) || 0) - (Number(s.incomeReturnSum) || 0);
    byDay[key].cnt += Number(s.incomeCnt) || 0;
  });
  return byDay;
}

/* ============================================================
   3. ДЕМО-ГЕНЕРАТОР
   ============================================================ */

const OPEN_HOUR = 10, CLOSE_HOUR = 20;
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function makeRng(k){let a=hashSeed(k);return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const DEMO_CATALOG = {
  shop1: [['Матовая помада',690],['Тушь для ресниц',850],['Блеск для губ',520],['Крем для лица',1290],['Мицеллярная вода',430],['Патчи для глаз',340],['Лак для ногтей',380],['Кисть для тона',640],['Сыворотка',1150],['Пудра',720]],
  shop2: [['Пряжа акрил',180],['Пряжа шерсть',340],['Спицы круговые',490],['Крючок',210],['Набор для вышивки',1150],['Мулине',60],['Фетр листовой',90],['Бисер',140],['Канва Aida',320],['Пяльцы',450]]
};
const DEMO_BASE = { shop1: 24, shop2: 15 };

function demoReceipts(shopKey, date, now) {
  const day = startOfDay(date), today = startOfDay(now);
  if (day > today) return [];
  const rnd = makeRng(shopKey + '|' + ymd(day));
  const dow = day.getDay(), weekend = dow === 0 || dow === 6;
  const mf = 0.85 + 0.3 * makeRng(shopKey + '|m' + day.getFullYear() + '-' + day.getMonth())();
  const count = Math.max(0, Math.round((DEMO_BASE[shopKey] || 18) * (weekend ? 1.35 : 1) * mf * (0.7 + rnd() * 0.6)));
  const cat = DEMO_CATALOG[shopKey] || DEMO_CATALOG.shop1;
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = OPEN_HOUR + rnd() * (CLOSE_HOUR - OPEN_HOUR);
    const when = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(t), Math.floor((t % 1) * 60));
    const n = 1 + Math.floor(rnd() * 3);
    const items = []; let sum = 0;
    for (let j = 0; j < n; j++) {
      const [name, price] = cat[Math.floor(rnd() * cat.length)];
      const qty = 1 + Math.floor(rnd() * 3);
      sum += price * qty;
      items.push({ name, qty, total: price * qty });
    }
    out.push({ id: 'd' + i, date: when, sum, cash: 0, ecash: sum, items });
  }
  const lim = day.getTime() === today.getTime() ? out.filter(r => r.date <= now) : out;
  return lim.sort((a, b) => a.date - b.date);
}

function demoReceiptsRange(shopKey, from, to, now) {
  let all = [];
  const d = new Date(from);
  while (d <= to) { all = all.concat(demoReceipts(shopKey, d, now)); d.setDate(d.getDate() + 1); }
  return all;
}

function demoDays(shopKey, from, to, now) {
  const byDay = {};
  const d = new Date(from);
  while (d <= to) {
    const rs = demoReceipts(shopKey, d, now);
    if (rs.length) byDay[ymd(d)] = { sum: rs.reduce((s, r) => s + r.sum, 0), cnt: rs.length };
    d.setDate(d.getDate() + 1);
  }
  return byDay;
}

/* ============================================================
   4. АГРЕГАЦИЯ ТОВАРОВ И ПРОДАЖ
   ============================================================ */

function aggregate(receipts) {
  const total = receipts.reduce((s, r) => s + r.sum, 0);
  const count = receipts.length;
  const pm = new Map();
  receipts.forEach(r => r.items.forEach(it => {
    const p = pm.get(it.name) || { name: it.name, qty: 0, revenue: 0 };
    p.qty += it.qty; p.revenue += it.total; pm.set(it.name, p);
  }));
  const products = [...pm.values()];
  const byRevenue = [...products].sort((a, b) => b.revenue - a.revenue);
  const byQty = [...products].sort((a, b) => b.qty - a.qty);
  return {
    total, count,
    cash: receipts.reduce((s, r) => s + r.cash, 0),
    ecash: receipts.reduce((s, r) => s + r.ecash, 0),
    avg: count ? total / count : 0,
    max: count ? Math.max(...receipts.map(r => r.sum)) : 0,
    first: count ? receipts[0].date : null,
    last: count ? receipts[count - 1].date : null,
    unitsTotal: products.reduce((s, p) => s + p.qty, 0),
    products, byRevenue, byQty,
    topByQty: byQty[0] || null,
    topByRevenue: byRevenue[0] || null
  };
}

/* ============================================================
   5. ГРАФИК
   ============================================================ */

function Chart({ data, height = 90 }) {
  const [sel, setSel] = useState(null);
  useEffect(() => { setSel(null); }, [data]);
  if (!data || !data.length) return null;
  const max = Math.max(...data.map(d => d.value), 1);
  const p = sel !== null ? data[sel] : null;
  return (
    <div style={{ marginTop: 18 }}>
      <div style={{ minHeight: 44, marginBottom: 8 }}>
        {p ? (
          <div>
            <div style={{ fontSize: 22, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>{money(p.value)}</div>
            <div style={{ fontSize: 13, color: '#6E6B62', marginTop: 2 }}>{p.label}</div>
          </div>
        ) : (
          <div style={{ fontSize: 13, color: '#8B887E' }}>Нажмите на столбик, чтобы увидеть сумму</div>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: data.length > 20 ? 1 : 3, height }}>
        {data.map((d, i) => (
          <button key={i} onClick={() => setSel(sel === i ? null : i)}
            style={{ flex: 1, height: '100%', display: 'flex', alignItems: 'flex-end', background: 'none', border: 0, padding: 0, minWidth: 4, cursor: 'pointer' }}>
            <div style={{
              width: '100%',
              height: d.value > 0 ? Math.max(5, (d.value / max) * 100) + '%' : '2px',
              background: sel === i ? '#17150F' : (d.value > 0 ? 'rgba(23,21,15,0.42)' : 'rgba(23,21,15,0.12)'),
              borderRadius: 2
            }} />
          </button>
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6E6B62', marginTop: 8, fontVariantNumeric: 'tabular-nums' }}>
        <span>{data[0].tick}</span><span>{data[data.length - 1].tick}</span>
      </div>
    </div>
  );
}

/* ============================================================
   6. ПРИЛОЖЕНИЕ
   ============================================================ */

function App() {
  const [now, setNow] = useState(new Date());
  const [screen, setScreen] = useState('sales');
  const [activeShop, setActiveShop] = useState('shop1');

  const [dateMode, setDateMode] = useState('auto');
  const [pickDay, setPickDay] = useState(ymd(new Date()));
  const [rangeFrom, setRangeFrom] = useState(ymd(new Date()));
  const [rangeTo, setRangeTo] = useState(ymd(new Date()));
  const [sortBy, setSortBy] = useState('revenue');
  const [detailShop, setDetailShop] = useState(null);

  const [showRangeDetail, setShowRangeDetail] = useState(false);
  const [rangeItemsState, setRangeItemsState] = useState({ s: 'idle', agg: null });

  const [month, setMonth] = useState(new Date().getMonth());
  const [year, setYear] = useState(new Date().getFullYear());
  const [chartYear, setChartYear] = useState(new Date().getFullYear());
  const [compare, setCompare] = useState(false);

  const [settingsOpen, setSettingsOpen] = useState(false);
  const [tokens, setTokens] = useState({ shop1: '', shop2: '' });
  const [tempTokens, setTempTokens] = useState({ shop1: '', shop2: '' });
  const [demoMode, setDemoMode] = useState(false);
  const [tempDemo, setTempDemo] = useState(false);
  const [isManualRefreshing, setIsManualRefreshing] = useState(false);

  const [salesState, setSalesState] = useState({ shop1: { s: 'idle' }, shop2: { s: 'idle' } });
  const [rangeState, setRangeState] = useState({ s: 'idle' });
  const [prevYearSum, setPrevYearSum] = useState(null);
  const reqId = useRef(0);
  const cache = useRef(new Map());

  useEffect(() => { const id = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(id); }, []);

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('ofdTokens') || '{}');
      const t = { shop1: saved.shop1 || '', shop2: saved.shop2 || '' };
      setTokens(t); setTempTokens(t);
      const dm = localStorage.getItem('ofdDemo') === '1';
      setDemoMode(dm); setTempDemo(dm);
    } catch (e) {}
  }, []);

  const saveSettings = () => {
    localStorage.setItem('ofdTokens', JSON.stringify(tempTokens));
    localStorage.setItem('ofdDemo', tempDemo ? '1' : '0');
    setTokens(tempTokens); setDemoMode(tempDemo); setSettingsOpen(false);
    cache.current.clear();
  };

  const loadReceipts = useCallback(async (k, from, to, force = false) => {
    const key = `${k}|${demoMode ? 'demo' : 'live'}|${from}|${to}`;
    const touchesToday = to >= ymd(now);
    const hit = cache.current.get(key);
    if (!force && hit && (!touchesToday || Date.now() - hit.at < 90000)) return hit.data;

    const data = (demoMode || !tokens[k])
      ? demoReceiptsRange(k, new Date(from + 'T00:00:00'), new Date(to + 'T00:00:00'), now)
      : await apiReceipts(tokens[k], from, to);

    cache.current.set(key, { at: Date.now(), data });
    return data;
  }, [demoMode, tokens, now]);

  const loadSales = useCallback(async (force = false) => {
    const my = ++reqId.current;
    const loadShop = async (k) => {
      if (!demoMode && !tokens[k]) { setSalesState(p => ({ ...p, [k]: { s: 'notoken' } })); return; }
      setSalesState(p => ({ ...p, [k]: { s: 'loading' } }));
      try {
        let receipts = [], from, to, label;
        if (dateMode === 'day') {
          from = to = pickDay;
          receipts = await loadReceipts(k, from, to, force);
          label = longDate(new Date(from + 'T00:00:00'));
        } else if (dateMode === 'range') {
          from = rangeFrom; to = rangeTo;
          if (from > to) { const t = from; from = to; to = t; }
          receipts = await loadReceipts(k, from, to, force);
          label = `${dmy(new Date(from + 'T00:00:00'))} — ${dmy(new Date(to + 'T00:00:00'))}`;
        } else {
          const today = ymd(now);
          receipts = await loadReceipts(k, today, today, force);
          let dayKey = today;
          if (!receipts.length) {
            const backFrom = addDaysStr(today, -13);
            const recent = await loadReceipts(k, backFrom, today, force);
            const byDay = new Map();
            recent.forEach(r => {
              const key = ymd(r.date);
              if (!byDay.has(key)) byDay.set(key, []);
              byDay.get(key).push(r);
            });
            const days = [...byDay.keys()].sort();
            if (days.length) {
              dayKey = days[days.length - 1];
              receipts = byDay.get(dayKey);
            }
          }
          from = to = dayKey;
          const d = new Date(dayKey + 'T00:00:00');
          const back = daysBetween(d, now);
          label = back === 0 ? `сегодня, ${longDate(d)}` : back === 1 ? `вчера, ${longDate(d)}` : `${DOW_SHORT[d.getDay()]}, ${longDate(d)}`;
        }
        if (reqId.current !== my) return;
        const spanDays = daysBetween(new Date(from + 'T00:00:00'), new Date(to + 'T00:00:00')) + 1;
        setSalesState(p => ({ ...p, [k]: { s: 'ok', receipts, agg: aggregate(receipts), label, from, to, spanDays } }));
      } catch (e) {
        if (reqId.current !== my) return;
        setSalesState(p => ({ ...p, [k]: { s: 'error', msg: e.message } }));
      }
    };
    await Promise.all(Object.keys(SHOPS).map(loadShop));
  }, [dateMode, pickDay, rangeFrom, rangeTo, now, tokens, demoMode, loadReceipts]);

  const range = useMemo(() => {
    if (screen === 'week') {
      const to = startOfDay(now);
      const from = new Date(to); from.setDate(to.getDate() - 6);
      return { from, to, kind: 'days', title: 'последние 7 дней', limit: 10 };
    }
    if (screen === 'month') {
      return { from: new Date(year, month, 1), to: new Date(year, month + 1, 0), kind: 'days', title: `${MONTHS[month]} ${year}`, limit: 20 };
    }
    return { from: new Date(chartYear, 0, 1), to: new Date(chartYear, 11, 31), kind: 'months', title: `${chartYear} год`, limit: 50 };
  }, [screen, now, year, month, chartYear]);

  const loadRange = useCallback(async () => {
    if (screen === 'sales') return;
    const my = ++reqId.current;
    const k = activeShop;
    if (!demoMode && !tokens[k]) { setRangeState({ s: 'notoken' }); return; }
    setRangeState({ s: 'loading' });
    try {
      const byDay = demoMode || !tokens[k]
        ? demoDays(k, new Date(range.from), range.to, now)
        : await apiDays(tokens[k], ymd(range.from), ymd(range.to));
      if (reqId.current !== my) return;
      setRangeState({ s: 'ok', byDay });
    } catch (e) {
      if (reqId.current !== my) return;
      setRangeState({ s: 'error', msg: e.message });
    }
  }, [screen, activeShop, tokens, demoMode, range, now]);

  const loadRangeProducts = useCallback(async () => {
    const k = activeShop;
    if (!demoMode && !tokens[k]) return;
    setRangeItemsState({ s: 'loading', agg: null });
    try {
      const receipts = await loadReceipts(k, ymd(range.from), ymd(range.to));
      setRangeItemsState({ s: 'ok', agg: aggregate(receipts) });
    } catch (e) {
      setRangeItemsState({ s: 'error', msg: e.message, agg: null });
    }
  }, [activeShop, demoMode, tokens, range, loadReceipts]);

  useEffect(() => {
    setShowRangeDetail(false);
    setRangeItemsState({ s: 'idle', agg: null });
  }, [screen, activeShop, month, year, chartYear]);

  useEffect(() => {
    if (showRangeDetail && rangeItemsState.s === 'idle') {
      loadRangeProducts();
    }
  }, [showRangeDetail, rangeItemsState.s, loadRangeProducts]);

  useEffect(() => { if (screen === 'sales') loadSales(); }, [screen, loadSales]);
  useEffect(() => { if (screen !== 'sales') loadRange(); }, [screen, loadRange]);

  const handleRefresh = useCallback(async () => {
    setIsManualRefreshing(true);
    cache.current.clear();
    setNow(new Date());
    if (screen === 'sales') {
      await loadSales(true);
    } else {
      await loadRange();
      if (showRangeDetail) await loadRangeProducts();
    }
    setTimeout(() => setIsManualRefreshing(false), 500);
  }, [screen, loadSales, loadRange, showRangeDetail, loadRangeProducts]);

  useEffect(() => {
    const onFocus = () => {
      setNow(new Date());
      if (screen === 'sales') loadSales();
      else loadRange();
    };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') onFocus();
    });
    return () => {
      window.removeEventListener('focus', onFocus);
      document.removeEventListener('visibilitychange', onFocus);
    };
  }, [screen, loadSales, loadRange]);

  useEffect(() => {
    if (screen !== 'month' || !compare) { setPrevYearSum(null); return; }
    let cancelled = false;
    (async () => {
      const k = activeShop;
      const from = new Date(year - 1, month, 1), to = new Date(year - 1, month + 1, 0);
      try {
        const byDay = demoMode || !tokens[k] ? demoDays(k, new Date(from), to, now) : await apiDays(tokens[k], ymd(from), ymd(to));
        if (!cancelled) setPrevYearSum(Object.values(byDay).reduce((s, d) => s + d.sum, 0));
      } catch (e) { if (!cancelled) setPrevYearSum(null); }
    })();
    return () => { cancelled = true; };
  }, [screen, compare, activeShop, year, month, tokens, demoMode, now]);

  const bars = useMemo(() => {
    if (rangeState.s !== 'ok') return [];
    const byDay = rangeState.byDay || {};
    if (range.kind === 'months') {
      return MONTHS.map((name, m) => {
        const days = new Date(chartYear, m + 1, 0).getDate();
        let sum = 0;
        for (let d = 1; d <= days; d++) sum += (byDay[`${chartYear}-${pad(m + 1)}-${pad(d)}`] || {}).sum || 0;
        return { value: sum, label: `${name} ${chartYear}`, tick: MONTHS_SHORT[m] };
      });
    }
    const out = [];
    const d = new Date(range.from);
    while (d <= range.to) {
      const rec = byDay[ymd(d)] || { sum: 0 };
      out.push({
        value: rec.sum,
        label: screen === 'week' ? `${DOW_SHORT[d.getDay()]}, ${dmy(d)}` : `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`,
        tick: screen === 'week' ? DOW_SHORT[d.getDay()] : String(d.getDate())
      });
      d.setDate(d.getDate() + 1);
    }
    return out;
  }, [rangeState, range, screen, chartYear]);

  const rangeTotals = useMemo(() => {
    if (rangeState.s !== 'ok') return null;
    const vals = Object.values(rangeState.byDay || {});
    const sum = vals.reduce((s, d) => s + d.sum, 0);
    const cnt = vals.reduce((s, d) => s + d.cnt, 0);
    const active = bars.filter(b => b.value > 0);
    return { sum, cnt, avgCheck: cnt ? sum / cnt : 0, avgUnit: active.length ? sum / active.length : 0, best: active.length ? Math.max(...active.map(b => b.value)) : 0 };
  }, [rangeState, bars]);

  /* ---------- стили ---------- */

  const S = {
    page: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: '#F7F6F3' },
    header: {
      paddingTop: 'max(14px, env(safe-area-inset-top))',
      paddingBottom: '10px',
      paddingLeft: '20px',
      paddingRight: '20px',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between'
    },
    hTitle: {
      fontSize: 18,
      letterSpacing: '0.08em',
      textTransform: 'uppercase',
      color: '#17150F',
      fontWeight: 700,
      marginRight: '16px',
      flexShrink: 0
    },
    topActions: {
      display: 'flex',
      gap: 10,
      alignItems: 'center',
      flexShrink: 0
    },
    topActionBtn: {
      fontSize: 16,
      fontWeight: 500,
      color: '#17150F',
      background: 'rgba(23,21,15,0.06)',
      border: '1px solid rgba(23,21,15,0.14)',
      padding: '7px 14px',
      borderRadius: 6,
      cursor: 'pointer',
      display: 'inline-flex',
      alignItems: 'center',
      gap: 6,
      whiteSpace: 'nowrap'
    },
    tabs: { display: 'flex', gap: 24, padding: '0 20px', borderBottom: '1px solid rgba(23,21,15,0.12)' },
    tab: { fontSize: 17, background: 'none', border: 0, color: '#6E6B62', padding: '0 0 12px', borderBottom: '3px solid transparent', cursor: 'pointer' },
    tabOn: { color: '#17150F', borderBottomColor: '#17150F', fontWeight: 600 },
    scroll: { flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', paddingBottom: 20 },
    block: { padding: '18px 20px', borderTop: '1px solid rgba(23,21,15,0.12)' },
    big: { fontSize: 38, lineHeight: 1.05, letterSpacing: '-0.03em', fontVariantNumeric: 'tabular-nums', fontWeight: 600 },
    caption: { fontSize: 14, color: '#4A473F', marginTop: 4 },
    secTitle: { fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#4A473F', marginBottom: 10, fontWeight: 600 },
    row: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderTop: '1px solid rgba(23,21,15,0.12)', fontSize: 16 },
    label: { color: '#4A473F' },
    value: { fontVariantNumeric: 'tabular-nums', fontWeight: 500 },
    sub: { fontSize: 13, color: '#6E6B62', marginTop: 2 },
    nav: {
      display: 'flex',
      borderTop: '1px solid rgba(23,21,15,0.12)',
      paddingTop: '8px',
      paddingBottom: 'max(10px, env(safe-area-inset-bottom))',
      background: '#F2F0EB'
    },
    navBtn: { flex: 1, background: 'none', border: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5, cursor: 'pointer', padding: '2px 0' },
    chip: on => ({
      background: on ? '#17150F' : '#FFFDFA', color: on ? '#F7F6F3' : '#4A473F',
      border: on ? '1px solid #17150F' : '1px solid rgba(23,21,15,0.22)',
      padding: '8px 14px', fontSize: 15, borderRadius: 4, cursor: 'pointer', whiteSpace: 'nowrap'
    }),
    lead: { padding: '12px 0', borderTop: '1px solid rgba(23,21,15,0.12)' },
    fieldLabel: { fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#6E6B62', marginBottom: 6 }
  };

  const Tabs = () => (
    <div style={S.tabs}>
      {Object.entries(SHOPS).map(([k, s]) => (
        <button key={k} onClick={() => setActiveShop(k)} style={{ ...S.tab, ...(activeShop === k ? S.tabOn : {}) }}>{s.name}</button>
      ))}
    </div>
  );

  const Status = ({ st, retry }) => {
    if (st.s === 'loading') return <div style={{ fontSize: 15, color: '#6E6B62', padding: '8px 0' }}>Загружаю…</div>;
    if (st.s === 'notoken') return <div style={{ fontSize: 15, color: '#4A473F', padding: '8px 0' }}>Добавьте API-токен в настройках</div>;
    if (st.s === 'error') return (
      <div style={{ padding: '8px 0' }}>
        <div style={{ fontSize: 15, color: '#17150F', lineHeight: 1.4 }}>{st.msg}</div>
        <button onClick={retry} style={{ ...S.chip(false), marginTop: 12 }}>Повторить</button>
      </div>
    );
    return null;
  };

  const Cell = ({ label, value }) => (
    <div>
      <div style={{ fontSize: 12, color: '#6E6B62', marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 16, fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{value}</div>
    </div>
  );

  /* ---------- Товарная аналитика ---------- */
  const ProductsSection = ({ agg, limit = 5 }) => {
    if (!agg || !agg.products || agg.products.length === 0) return null;
    const list = sortBy === 'qty' ? agg.byQty : agg.byRevenue;
    const topItems = list.slice(0, limit);

    return (
      <div style={{ marginTop: 22 }}>
        {agg.topByQty && (
          <div>
            <div style={S.secTitle}>Лидеры продаж</div>
            <div style={S.lead}>
              <div style={{ fontSize: 13, color: '#6E6B62', marginBottom: 4 }}>Больше всего штук</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 12 }}>
                <div style={{ fontSize: 16 }}>{agg.topByQty.name}</div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div style={{ fontSize: 16, fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{agg.topByQty.qty} шт</div>
                  <div style={S.sub}>{money(agg.topByQty.revenue)}</div>
                </div>
              </div>
            </div>
            <div style={{ ...S.lead, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
              <div style={{ fontSize: 13, color: '#6E6B62', marginBottom: 4 }}>Больше всего выручки</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 12 }}>
                <div style={{ fontSize: 16 }}>{agg.topByRevenue.name}</div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div style={{ fontSize: 16, fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>{money(agg.topByRevenue.revenue)}</div>
                  <div style={S.sub}>{agg.topByRevenue.qty} шт</div>
                </div>
              </div>
            </div>
          </div>
        )}

        <div style={{ marginTop: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div style={{ ...S.secTitle, marginBottom: 0 }}>Топ {limit} товаров</div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button onClick={() => setSortBy('revenue')} style={{ ...S.chip(sortBy === 'revenue'), padding: '6px 10px', fontSize: 13 }}>₽</button>
              <button onClick={() => setSortBy('qty')} style={{ ...S.chip(sortBy === 'qty'), padding: '6px 10px', fontSize: 13 }}>шт</button>
            </div>
          </div>
          {topItems.map((p, i) => (
            <div key={i} style={S.row}>
              <div style={{ paddingRight: 12, display: 'flex', gap: 8, fontSize: 15 }}>
                <span style={{ color: '#8B887E', minWidth: 18 }}>{i + 1}.</span>
                <span>{p.name}</span>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <div style={S.value}>{sortBy === 'qty' ? `${p.qty} шт` : money(p.revenue)}</div>
                <div style={S.sub}>{sortBy === 'qty' ? money(p.revenue) : `${p.qty} шт`}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  };

  /* ---------- Экран: ПРОДАЖИ ---------- */

  const buildChartBars = (st) => {
    if (!st || st.s !== 'ok') return [];
    if (st.spanDays > 1) {
      const byDay = {};
      st.receipts.forEach(r => { const key = ymd(r.date); byDay[key] = (byDay[key] || 0) + r.sum; });
      const out = [];
      const cur = new Date(st.from + 'T00:00:00'), end = new Date(st.to + 'T00:00:00');
      while (cur <= end) {
        out.push({ value: byDay[ymd(cur)] || 0, label: `${DOW_SHORT[cur.getDay()]}, ${cur.getDate()} ${MONTHS[cur.getMonth()].toLowerCase()}`, tick: dmy(cur) });
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }
    return st.receipts.map(r => ({
      value: r.sum,
      label: `Покупка в ${hhmm(r.date)}${r.items.length ? ` · ${r.items.length} ${plural(r.items.length, 'позиция', 'позиции', 'позиций')}` : ''}`,
      tick: hhmm(r.date)
    }));
  };

  const renderSalesOverview = () => (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <div style={{ padding: '8px 20px 10px', borderTop: '1px solid rgba(23,21,15,0.12)', display: 'flex', gap: 8 }}>
        <button onClick={() => setDateMode('auto')} style={{ ...S.chip(dateMode === 'auto'), padding: '8px 12px', fontSize: 14 }}>Сегодня</button>
        <button onClick={() => setDateMode('day')} style={{ ...S.chip(dateMode === 'day'), padding: '8px 12px', fontSize: 14 }}>Дата</button>
        <button onClick={() => setDateMode('range')} style={{ ...S.chip(dateMode === 'range'), padding: '8px 12px', fontSize: 14 }}>Период</button>
      </div>

      {dateMode === 'day' && (
        <div style={{ padding: '0 20px 10px' }}>
          <input type="date" value={pickDay} max={ymd(now)} onChange={e => setPickDay(e.target.value)} />
        </div>
      )}
      {dateMode === 'range' && (
        <div style={{ padding: '0 20px 10px', display: 'flex', gap: 8 }}>
          <input type="date" value={rangeFrom} max={ymd(now)} onChange={e => setRangeFrom(e.target.value)} />
          <input type="date" value={rangeTo} max={ymd(now)} onChange={e => setRangeTo(e.target.value)} />
        </div>
      )}

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
        <div>
          {Object.keys(SHOPS).map(k => {
            const st = salesState[k] || { s: 'idle' };
            const d = st.agg;

            return (
              <div key={k}
                onClick={() => { if (st.s === 'ok' && d.count > 0) setDetailShop(k); }}
                style={{
                  padding: '14px 20px 16px',
                  borderTop: '1px solid rgba(23,21,15,0.12)',
                  cursor: st.s === 'ok' && d && d.count > 0 ? 'pointer' : 'default'
                }}>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontSize: 14, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#4A473F', fontWeight: 600 }}>
                    {SHOPS[k].name}
                  </div>
                  {st.s === 'ok' && d.count > 0 && (
                    <div style={{ fontSize: 14, color: '#6E6B62', fontWeight: 500 }}>Подробнее →</div>
                  )}
                </div>

                {st.s !== 'ok' ? (
                  <div style={{ marginTop: 6 }}><Status st={st} retry={loadSales} /></div>
                ) : (
                  <>
                    <div style={{ fontSize: 34, lineHeight: 1.05, letterSpacing: '-0.03em', fontVariantNumeric: 'tabular-nums', fontWeight: 600, marginTop: 6 }}>
                      {money(d.total)}
                    </div>
                    <div style={{ fontSize: 13, color: '#4A473F', marginTop: 3 }}>{st.label}</div>

                    {d.count === 0 ? (
                      <div style={{ fontSize: 14, color: '#6E6B62', marginTop: 10 }}>продаж не было</div>
                    ) : (
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 16px', marginTop: 12 }}>
                        <Cell label="Чеков" value={d.count} />
                        <Cell label="Последний чек" value={hhmm(d.last)} />
                        <Cell label="Наличные" value={money(d.cash)} />
                        <Cell label="Карта" value={money(d.ecash)} />
                        <Cell label="Самая большая" value={money(d.max)} />
                        <Cell label="Средний чек" value={money(d.avg)} />
                      </div>
                    )}
                  </>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );

  const renderSalesDetail = () => {
    const k = detailShop;
    const st = salesState[k] || { s: 'idle' };
    const d = st.agg;
    const chartBars = buildChartBars(st);

    return (
      <div style={S.scroll}>
        <div style={{ padding: '12px 20px', borderTop: '1px solid rgba(23,21,15,0.12)' }}>
          <button onClick={() => setDetailShop(null)}
            style={{ background: 'none', border: 0, fontSize: 15, color: '#4A473F', padding: '4px 0', cursor: 'pointer', fontWeight: 500 }}>
            ← Назад
          </button>
        </div>

        <div style={S.block}>
          <div style={S.secTitle}>{SHOPS[k].name}</div>

          {st.s !== 'ok' ? <Status st={st} retry={loadSales} /> : (
            <>
              <div style={S.big}>{money(d.total)}</div>
              <div style={S.caption}>
                {st.label} · {d.count} {plural(d.count, 'чек', 'чека', 'чеков')}
              </div>

              <Chart data={chartBars} />

              <div style={{ marginTop: 20 }}>
                <div style={S.row}><span style={S.label}>Средний чек</span><span style={S.value}>{money(d.avg)}</span></div>
                <div style={S.row}><span style={S.label}>Самая большая покупка</span><span style={S.value}>{money(d.max)}</span></div>
                <div style={S.row}><span style={S.label}>Товаров продано</span><span style={S.value}>{d.unitsTotal} шт</span></div>
                <div style={S.row}><span style={S.label}>Первая продажа</span><span style={S.value}>{hhmm(d.first)}</span></div>
                <div style={{ ...S.row, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
                  <span style={S.label}>Последняя продажа</span><span style={S.value}>{hhmm(d.last)}</span>
                </div>
              </div>

              <ProductsSection agg={d} limit={5} />
            </>
          )}
        </div>
      </div>
    );
  };

  const renderSales = () => detailShop ? renderSalesDetail() : renderSalesOverview();

  const renderRangeProductBlock = () => {
    if (!showRangeDetail) {
      return (
        <button onClick={() => setShowRangeDetail(true)}
          style={{ ...S.chip(false), width: '100%', marginTop: 20, textAlign: 'center', padding: '12px', fontSize: 15, fontWeight: 500 }}>
          Подробнее по товарам (Топ {range.limit}) →
        </button>
      );
    }

    return (
      <div style={{ marginTop: 24, borderTop: '1px solid rgba(23,21,15,0.12)', paddingTop: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontSize: 15, fontWeight: 600 }}>Товары за период</div>
          <button onClick={() => setShowRangeDetail(false)} style={{ background: 'none', border: 0, color: '#6E6B62', fontSize: 14, cursor: 'pointer' }}>Скрыть</button>
        </div>
        {rangeItemsState.s === 'loading' && <div style={{ padding: '14px 0', color: '#6E6B62', fontSize: 14 }}>Загружаю детализацию товаров…</div>}
        {rangeItemsState.s === 'error' && <div style={{ padding: '14px 0', color: '#17150F', fontSize: 14 }}>{rangeItemsState.msg}</div>}
        {rangeItemsState.s === 'ok' && <ProductsSection agg={rangeItemsState.agg} limit={range.limit} />}
      </div>
    );
  };

  /* ---------- Экраны: НЕДЕЛЯ / МЕСЯЦ / ГОД ---------- */

  const renderWeek = () => (
    <>
      <Tabs />
      <div style={S.scroll}>
        <div style={S.block}>
          {rangeState.s !== 'ok' ? <Status st={rangeState} retry={loadRange} /> : (
            <>
              <div style={S.big}>{money(rangeTotals.sum)}</div>
              <div style={S.caption}>{SHOPS[activeShop].name} · последние 7 дней</div>
              <Chart data={bars} />
              <div style={{ marginTop: 20 }}>
                <div style={S.row}><span style={S.label}>Чеков</span><span style={S.value}>{rangeTotals.cnt}</span></div>
                <div style={S.row}><span style={S.label}>Средний чек</span><span style={S.value}>{money(rangeTotals.avgCheck)}</span></div>
                <div style={S.row}><span style={S.label}>В среднем за день</span><span style={S.value}>{money(rangeTotals.sum / 7)}</span></div>
                <div style={{ ...S.row, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
                  <span style={S.label}>Лучший день</span><span style={S.value}>{money(rangeTotals.best)}</span>
                </div>
              </div>

              {renderRangeProductBlock()}
            </>
          )}
        </div>
      </div>
    </>
  );

  const renderMonth = () => {
    const delta = (rangeTotals && prevYearSum > 0) ? ((rangeTotals.sum - prevYearSum) / prevYearSum) * 100 : null;
    return (
      <>
        <Tabs />
        <div style={S.scroll}>
          <div style={{ ...S.block, paddingBottom: 16 }}>
            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 }}>
              {MONTHS_SHORT.map((m, i) => <button key={i} onClick={() => setMonth(i)} style={S.chip(month === i)}>{m}</button>)}
            </div>
            <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
              {[0, 1, 2].map(o => { const y = new Date().getFullYear() - o; return <button key={y} onClick={() => setYear(y)} style={S.chip(year === y)}>{y}</button>; })}
            </div>
          </div>

          <div style={S.block}>
            {rangeState.s !== 'ok' ? <Status st={rangeState} retry={loadRange} /> : (
              <>
                <div style={S.big}>{money(rangeTotals.sum)}</div>
                <div style={S.caption}>{MONTHS[month]} {year} · по дням</div>
                <Chart data={bars} />
                <div style={{ marginTop: 20 }}>
                  <div style={S.row}><span style={S.label}>Чеков</span><span style={S.value}>{rangeTotals.cnt}</span></div>
                  <div style={S.row}><span style={S.label}>Средний чек</span><span style={S.value}>{money(rangeTotals.avgCheck)}</span></div>
                  <div style={S.row}><span style={S.label}>В среднем за день</span><span style={S.value}>{money(rangeTotals.avgUnit)}</span></div>
                  <div style={{ ...S.row, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
                    <span style={S.label}>Лучший день</span><span style={S.value}>{money(rangeTotals.best)}</span>
                  </div>
                </div>

                <button onClick={() => setCompare(!compare)}
                  style={{ marginTop: 18, fontSize: 15, color: '#4A473F', background: 'none', border: 0, padding: '8px 0', cursor: 'pointer', fontWeight: 500 }}>
                  {compare ? '− Скрыть сравнение с прошлым годом' : '+ Сравнить с прошлым годом'}
                </button>

                {compare && (
                  <div style={{ marginTop: 6 }}>
                    <div style={S.row}>
                      <span style={S.label}>{MONTHS[month]} {year - 1}</span>
                      <span style={S.value}>{prevYearSum === null ? 'загружаю…' : money(prevYearSum)}</span>
                    </div>
                    <div style={{ ...S.row, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
                      <span style={S.label}>Динамика</span>
                      <span style={S.value}>{delta === null ? '—' : (delta >= 0 ? '+' : '') + delta.toFixed(1) + '%'}</span>
                    </div>
                  </div>
                )}

                {renderRangeProductBlock()}
              </>
            )}
          </div>
        </div>
      </>
    );
  };

  const renderYear = () => (
    <>
      <Tabs />
      <div style={S.scroll}>
        <div style={{ ...S.block, paddingBottom: 16 }}>
          <div style={{ display: 'flex', gap: 6 }}>
            {[0, 1, 2, 3].map(o => { const y = new Date().getFullYear() - o; return <button key={y} onClick={() => setChartYear(y)} style={S.chip(chartYear === y)}>{y}</button>; })}
          </div>
        </div>
        <div style={S.block}>
          {rangeState.s !== 'ok' ? <Status st={rangeState} retry={loadRange} /> : (
            <>
              <div style={S.big}>{money(rangeTotals.sum)}</div>
              <div style={S.caption}>{SHOPS[activeShop].name} · {chartYear} по месяцам</div>
              <Chart data={bars} />
              <div style={{ marginTop: 20 }}>
                <div style={S.row}><span style={S.label}>Чеков</span><span style={S.value}>{rangeTotals.cnt}</span></div>
                <div style={S.row}><span style={S.label}>Средний чек</span><span style={S.value}>{money(rangeTotals.avgCheck)}</span></div>
                <div style={{ ...S.row, borderBottom: '1px solid rgba(23,21,15,0.12)' }}>
                  <span style={S.label}>Лучший месяц</span>
                  <span style={S.value}>{money(Math.max(0, ...bars.map(b => b.value)))}</span>
                </div>
              </div>

              {renderRangeProductBlock()}
            </>
          )}
        </div>
      </div>
    </>
  );

  const NAV = [
    { id: 'sales', label: 'Продажи' },
    { id: 'week', label: 'Неделя' },
    { id: 'month', label: 'Месяц' },
    { id: 'year', label: 'Год' }
  ];

  return (
    <div style={S.page}>
      <div style={S.header}>
        <div style={S.hTitle}>Продажи{demoMode ? ' · демо' : ''}</div>
        <div style={S.topActions}>
          <button style={S.topActionBtn} onClick={handleRefresh} title="Обновить данные">
            <span className={isManualRefreshing ? 'spinning' : ''} style={{ fontSize: 18, lineHeight: 1 }}>↻</span>
            <span>Обновить</span>
          </button>
          <button style={S.topActionBtn} onClick={() => { setTempTokens(tokens); setTempDemo(demoMode); setSettingsOpen(true); }}>
            <span>Настройки</span>
          </button>
        </div>
      </div>

      {screen === 'sales' && renderSales()}
      {screen === 'week' && renderWeek()}
      {screen === 'month' && renderMonth()}
      {screen === 'year' && renderYear()}

      <div style={S.nav}>
        {NAV.map(it => {
          const on = screen === it.id;
          return (
            <button key={it.id} onClick={() => { setScreen(it.id); setDetailShop(null); }} style={S.navBtn}>
              <div style={{
                width: 12, height: 12, borderRadius: '50%',
                background: on ? '#17150F' : 'transparent',
                border: on ? '2px solid #17150F' : '2px solid #9C998F'
              }} />
              <div style={{ fontSize: 14, color: on ? '#17150F' : '#6E6B62', fontWeight: on ? 600 : 400 }}>{it.label}</div>
            </button>
          );
        })}
      </div>

      {settingsOpen && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(7,6,4,0.35)', display: 'flex', alignItems: 'flex-end', zIndex: 1000 }}>
          <div style={{ background: '#F7F6F3', width: '100%', padding: '28px 20px 32px', maxHeight: '90vh', overflowY: 'auto', borderRadius: '12px 12px 0 0' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
              <div style={{ fontSize: 20, fontWeight: 600 }}>Настройки</div>
              <button onClick={() => setSettingsOpen(false)} style={{ background: 'none', border: 0, fontSize: 28, lineHeight: 1, color: '#4A473F', cursor: 'pointer' }}>×</button>
            </div>

            {Object.entries(SHOPS).map(([k, s]) => (
              <div key={k} style={{ marginBottom: 20 }}>
                <div style={S.fieldLabel}>{s.name}</div>
                <input type="password" placeholder="API-токен Яндекс ОФД" value={tempTokens[k]}
                  onChange={e => setTempTokens(p => ({ ...p, [k]: e.target.value.trim() }))}
                  style={{ width: '100%', border: '1px solid rgba(23,21,15,0.22)', background: '#FFFDFA', fontSize: 16, padding: '12px 14px', outline: 'none', color: '#17150F', borderRadius: 4 }} />
              </div>
            ))}

            <button onClick={() => setTempDemo(!tempDemo)} style={{ ...S.chip(tempDemo), width: '100%', textAlign: 'left', padding: '14px 16px', marginTop: 4 }}>
              Демо-режим {tempDemo ? 'включён' : 'выключен'}
            </button>
            <p style={{ fontSize: 13, color: '#4A473F', lineHeight: 1.5, margin: '14px 0 22px' }}>
              Токен: личный кабинет Яндекс ОФД → Интеграции → API[cite: 1]. Хранится только на этом устройстве[cite: 2].
            </p>

            <button onClick={saveSettings} style={{ width: '100%', padding: 15, background: '#17150F', color: '#F7F6F3', border: 0, fontSize: 16, fontWeight: 500, borderRadius: 4, cursor: 'pointer', marginBottom: 10 }}>Сохранить</button>
            <button onClick={() => setSettingsOpen(false)} style={{ width: '100%', padding: 15, background: 'transparent', color: '#17150F', border: '1px solid rgba(23,21,15,0.22)', fontSize: 16, borderRadius: 4, cursor: 'pointer' }}>Отмена</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
